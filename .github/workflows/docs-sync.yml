# After master's CI passes, Claude fixes the docs that what's new made wrong, in a pull request. The workflow is
# Raineworks', in raine-works/agents (.github/workflows/docs-sync.yml): this file only calls it, and comes from the raineworks-base
# skill's templates/workflows/docs-sync.yml. Change the workflow there, for every repository at once; here, only its
# inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Docs sync

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  docs-sync:
    name: Docs sync
    uses: raine-works/agents/.github/workflows/docs-sync.yml@d926350369c3f4b2e1b8337f1d631fdcd609b79f # raine-works/agents master
    secrets: inherit
    with:
      docs: >-
        AGENTS.md (the rules; CLAUDE.md is a link to it), STYLEGUIDE.md, README.md, docs/*.md and every package's
        packages/*/README.md. Never the release notes (packages/ui/src/release-notes/).
