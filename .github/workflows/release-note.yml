# Has Claude write a release's note, by hand (Actions → Release note → Run workflow), when a release has something
# worth telling the people who use the project. Where the note goes depends on whether it keeps
# its notes in a folder (input `notes-dir`), as an app that shows them does.
#
# With a notes folder, the note is for the next release, a file the repository's own build and release use (an app
# shows it, its CI publishes the GitHub release from it):
#
#   1. it works out the version the next release takes (input `version-command`);
#   2. Claude writes its note (<notes-dir>/<version>.md) from what changed since the last note, in the format of the
#      notes already there;
#   3. it opens it as the pull request `Release note <version>`, reviewed and merged like any other change. What
#      merging it does is the repository's: here, it's the release (ci.yml), whose app
#      shows the note and whose GitHub release is published from it.
#
# Without one, the note is for a release that's already tagged, and goes on its GitHub release only:
#
#   1. it takes the tag given (input `tag`), else the newest one, and the tag before it;
#   2. Claude writes the note from what changed between the two, in a file that's never committed;
#   3. it becomes the text of the tag's GitHub release, replacing what was there (or the release is made, if the tag
#      has none). No pull request: the person who ran it reads the release, and edits it there.
#
# Either way it takes turns with whatever else is in the `release` concurrency group (ci.yml on master), so
# no release is cut while it writes. What's particular to a repository is in its caller's inputs: the commands, the
# folder, and `guide`, anything Claude should know about its notes.
#
# Called by .github/workflows/release.yml (after a release CI cut without a note, or by hand), which
# grants it contents: write, pull-requests: write and id-token: write. It signs in to Anthropic with the job's OIDC
# token (workload identity federation: no API key is stored). With a notes folder its pull request is opened as the
# docs-sync GitHub App (the DOCS_SYNC_APP_CLIENT_ID variable and DOCS_SYNC_APP_PRIVATE_KEY secret, docs/development.md),
# which Docs sync opens its pull requests as too: one opened with the workflow's own token would start no checks. The
# .github/actions/setup action is run before its commands.
name: Release note

on:
  workflow_call:
    inputs:
      name:
        description: The project's name, as the note's readers know it (e.g. raineworks).
        type: string
        required: true
      notes-dir:
        description: >-
          The folder the repository keeps its release notes in, one <version>.md each. If it isn't there, the note
          goes on a GitHub release instead.
        type: string
        default: packages/ui/src/release-notes
      version-command:
        description: With a notes folder, the command that prints the version the next release takes.
        type: string
        default: bun packages/tools/src/release-cli.ts next
      check-command:
        description: >-
          With a notes folder, a command that fails when a note is malformed, run with the version after it, by
          Claude and again before the pull request is opened (what it prints is the run's summary). Empty for none.
        type: string
        default: bun packages/tools/src/release-cli.ts notes
      tag:
        description: Without a notes folder, the tag whose GitHub release gets the note. Without it, the newest tag.
        type: string
        default: ''
      guide:
        description: >-
          What else Claude should know to write this repository's notes, as prose: who reads them, where their
          format is described, what never to mention. Added to the general instructions.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  note:
    name: note
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and tag: the note is written from what's between two of them.
          fetch-depth: 0
          # Nothing is left on disk for later steps (an install's scripts, Claude writing the note): the steps that
          # open the pull request or publish the release bring their own token.
          persist-credentials: false
      # `folder`: the note is a file in the notes folder, opened as a pull request. `release`: it goes on a GitHub
      # release.
      - name: Where the note goes
        id: where
        env:
          NOTES_DIR: ${{ inputs.notes-dir }}
        run: |
          if [ -n "$NOTES_DIR" ] && [ -d "$NOTES_DIR" ]; then where=folder; else where=release; fi
          echo "where=$where" >> "$GITHUB_OUTPUT"
          echo "The note goes to: $where."

      # With a notes folder, its pull request is opened as the docs-sync GitHub App, never with the workflow's own
      # token: a pull request that token opened would start no checks. So without the app there's nothing this run
      # could finish: say so now, before Claude spends any time.
      - name: Check the docs-sync app is set up
        if: steps.where.outputs.where == 'folder'
        env:
          CLIENT_ID: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::The docs-sync GitHub App isn't set up: set the DOCS_SYNC_APP_CLIENT_ID variable and the DOCS_SYNC_APP_PRIVATE_KEY secret, and install the app on this repository (docs/development.md, Releases)."
            exit 1
          fi
      # And installed on this repository: a token that can only read its metadata, to find out now rather than after
      # Claude's step. The token the pull request is opened with is made only after it.
      - name: Check the docs-sync app is installed
        if: steps.where.outputs.where == 'folder'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-metadata: read
      # The repository's own setup action: what its commands below need installed.
      - uses: ./.github/actions/setup
        if: steps.where.outputs.where == 'folder' && hashFiles('.github/actions/setup/action.yml', '.github/actions/setup/action.yaml') != ''

      - name: Version
        id: version
        if: steps.where.outputs.where == 'folder'
        env:
          NOTES_DIR: ${{ inputs.notes-dir }}
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          # The caller's own command, from its workflow file.
          version="$(bash -c "$VERSION_COMMAND")"
          # It names a file, and is put in Claude's prompt and in commands: only what a version is made of.
          if ! printf '%s' "$version" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "::error::The version command printed something that isn't a version."
            exit 1
          fi
          note="${NOTES_DIR%/}/$version.md"
          if [ -f "$note" ]; then
            echo "::error::$version's note is already on master."
            exit 1
          fi
          # What's new since the last note (the last release with something to tell), else since the beginning.
          previous="$(git log -1 --format=%H --diff-filter=A -- "$NOTES_DIR" || true)"
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"
          echo "Writing $version's note (since ${previous:-the beginning})."

      # Without a notes folder: the tag the note is for, and the one before it.
      - name: Tag
        id: tag
        if: steps.where.outputs.where == 'release'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then TAG="$(git tag --sort=-creatordate | head -n 1)"; fi
          if [ -z "$TAG" ]; then
            echo "::error::This repository has no tags: a note is written for a release that's tagged."
            exit 1
          fi
          # It's put in Claude's prompt and in commands: only what a version tag is made of.
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/+-]*$'; then
            echo "::error::The tag may only have letters, digits, '.', '_', '/', '+' and '-'."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::There's no tag $TAG."
            exit 1
          fi
          note=release-note.md
          if [ -e "$note" ]; then
            echo "::error::$note is already in the repository, where this run writes its note: move it."
            exit 1
          fi
          # The tag before it, else the note covers everything up to it.
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "tag=$TAG"
            echo "previous=$previous"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"
          echo "Writing $TAG's note (since ${previous:-the beginning})."

      - name: Write the note
        if: steps.where.outputs.where == 'folder'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one, so no API key is stored. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Write the release note for ${{ inputs.name }} ${{ steps.version.outputs.version }} at
            `${{ steps.version.outputs.note }}`. It covers every commit since
            `${{ steps.version.outputs.previous || 'the first commit' }}`
            (`git log ${{ steps.version.outputs.previous && format('{0}..HEAD', steps.version.outputs.previous) || 'HEAD' }}`;
            read the diffs with `git show` where a subject isn't enough).

            First read the existing notes in `${{ inputs.notes-dir }}/`, and what the repository's docs say about
            release notes (AGENTS.md says which doc covers what). Match the notes' format and voice exactly: their
            frontmatter if they have one (a date is today's), their headings, their bullets. With no notes yet,
            follow the docs; with neither, write Markdown with `##` headings by area, then short bullets.

            - It's for the people who use ${{ inputs.name }}, not its developers: say what they can now do or what
              works differently, in plain words, bolding the names of what they click. Never mention refactors,
              tests, CI, dependencies or internal names. Leave out anything nobody using it would notice.
            - Where the notes show each audience only its own parts (blocks such as `::: for <zones>` … `:::`),
              put each change in a block naming exactly the audiences it affects, as the docs define them. Text
              outside a block is shown to everyone, so keep it for changes everyone sees. One audience must never
              read about another's changes.
            - If nothing in the range would be noticed by anyone, write a short note saying it's fixes and
              improvements.

            ${{ inputs.guide }}

            Write only that file.${{ inputs.check-command && format(' Then check it: `{0} {1}`.', inputs.check-command, steps.version.outputs.version) || '' }}
          # No `Bash(git …:*)` rules: a rule matches by prefix whatever options follow (`git log --output=<file>`
          # writes anywhere), and without one Claude Code's own read-only check runs git log, show and diff and
          # refuses those options. The only command allowed is the check, exactly as it's run below.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write(${{ steps.version.outputs.note }}),Edit(${{ steps.version.outputs.note }}),Glob,Grep${{ inputs.check-command && format(',Bash({0} {1})', inputs.check-command, steps.version.outputs.version) || '' }}"

      - name: Write the release's note
        if: steps.where.outputs.where == 'release'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one, so no API key is stored. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Write the release note for ${{ inputs.name }} ${{ steps.tag.outputs.tag }} at
            `${{ steps.tag.outputs.note }}`. It's the text of that tag's GitHub release, and covers every commit
            ${{ steps.tag.outputs.previous && format('after `{0}`, up to `{1}`', steps.tag.outputs.previous, steps.tag.outputs.tag) || format('up to `{0}`', steps.tag.outputs.tag) }}
            (`git log ${{ steps.tag.outputs.previous && format('{0}..{1}', steps.tag.outputs.previous, steps.tag.outputs.tag) || steps.tag.outputs.tag }}`;
            read the diffs with `git show` where a subject isn't enough).

            Read `README.md` first, to know what ${{ inputs.name }} is and who uses it, and what the repository's
            docs say about release notes, if anything. Then write the note:

            - Markdown, as GitHub renders a release: no frontmatter and no title (the release has one). `##`
              headings by area, then short bullets.
            - It's for the people who use ${{ inputs.name }}, not its developers: say what they can now do or what
              works differently, in plain words. Never mention refactors, tests, CI or internal names, and a
              dependency only when its change is one they'd notice. Leave out anything nobody using it would
              notice.
            - Say first, under its own heading, anything they have to do or that no longer works as it did.
            - If nothing in the range would be noticed by anyone, write a short note saying it's fixes and
              improvements.

            ${{ inputs.guide }}

            Write only that file.
          # No `Bash` at all: Claude Code's own read-only check runs git log, show and diff (see above).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write(${{ steps.tag.outputs.note }}),Edit(${{ steps.tag.outputs.note }}),Glob,Grep"

      # Claude may write only the note, but what it ran (and its tools' bugs) mustn't reach the pull request or the
      # release: the note is the only change in the tree, or nothing more runs (the check command is master's).
      - name: Check the note
        env:
          NOTE: ${{ steps.version.outputs.note || steps.tag.outputs.note }}
          VERSION: ${{ steps.version.outputs.version }}
          CHECK_COMMAND: ${{ inputs.check-command }}
          WHERE: ${{ steps.where.outputs.where }}
        run: |
          test -s "$NOTE" || { echo "::error::No note was written."; exit 1; }
          changed="$(git status --porcelain --untracked-files=all)"
          if [ "$changed" != "?? $NOTE" ]; then
            echo "::error::Only $NOTE may change, but the tree has:"
            printf '%s\n' "$changed"
            exit 1
          fi
          if [ "$WHERE" = folder ] && [ -n "$CHECK_COMMAND" ]; then
            bash -c "$CHECK_COMMAND $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$NOTE" >> "$GITHUB_STEP_SUMMARY"
          fi

      # With a notes folder: the note goes up as a pull request, reviewed and merged like any other change, opened as
      # the docs-sync app, its token made only now, so Claude's step never had it.
      - name: Use the docs-sync app
        id: app
        if: steps.where.outputs.where == 'folder'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request
        if: steps.where.outputs.where == 'folder'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: release-note/${{ steps.version.outputs.version }}
          base: master
          delete-branch: true
          add-paths: ${{ steps.version.outputs.note }}
          commit-message: Release note ${{ steps.version.outputs.version }}
          title: Release note ${{ steps.version.outputs.version }}
          body: |
            Claude wrote the release note for ${{ inputs.name }} ${{ steps.version.outputs.version }} (`${{ steps.version.outputs.note }}`). Read it as each of its readers will: once merged, it's what they're told about the release.

            If another release takes this version first, rename the file to the version the next release takes.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)

      # Without one: the note becomes the release's text, with the workflow's own token (nothing is pushed, so no
      # app). A release the tag already has keeps its title and assets; only its text is replaced.
      - name: Publish it on the release
        if: steps.where.outputs.where == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTE: ${{ steps.tag.outputs.note }}
          NAME: ${{ inputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTE"
          else
            gh release create "$TAG" --title "$NAME $TAG" --notes-file "$NOTE" --verify-tag
          fi
          echo "The note is on $(gh release view "$TAG" --json url --jq .url)"
