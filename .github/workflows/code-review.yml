# Claude reviews every pull request against the rules, and answers replies to its comments. The workflow is Raineworks', in
# raine-works/agents (.github/workflows/code-review.yml): this file only calls it, and comes from the raineworks-base skill's
# templates/workflows/code-review.yml. Change the workflow there, for every repository at once; here, only its inputs
# (with:). The Base rules check moves the pin when the shared workflows change.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  code-review:
    name: Code review
    uses: raine-works/agents/.github/workflows/code-review.yml@8d50b54592ee925341854a8a0aa2130336a1c416 # raine-works/agents master
    secrets: inherit
    with:
      focus: |
        - broken security rules: an input not validated with `validate(target, schema)`, content reaching the SSH
          terminal without `sanitize()`, the SSH server accepting more than its one pty shell, secrets or the host key
          in logs, output or the image, a workflow giving Claude a token or a tool it mustn't have;
        - correctness bugs: wrong logic, missed cases, races, a prerendered page whose server and browser renders
          differ (browser state read during render), what's served at a path (pages, the 404, assets, caching
          headers) changing by accident;
        - release and licence rules (AGENTS.md "Versions, releases and licences"): a hand-made tag, version or
          deploy, a package under a licence a zone can't ship, LGPL code outside the SSH image, a release note naming
          a version already released;
        - a route that isn't documented (`describeRoute` with every response it can give) or an error that isn't
          `{ error: { code, message } }`;
        - style rules that break things (STYLEGUIDE.md): relative imports, `process.env` read outside a package's env
          module, `try/catch` instead of `tryCatch`, a helper `@raineworks/tools` already has, a dependency added
          outside the catalog, a component the React Compiler would skip;
        - missing tests for new behaviour, failure paths and security-sensitive code;
        - pages that break at 375px, raw colours instead of theme tokens, copy that isn't sentence case with
          typographic quotes;
        - docs the change makes wrong and doesn't update (AGENTS.md says which doc covers what).
