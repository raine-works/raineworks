# Checks that GitHub Actions can sign in to Anthropic with workload identity federation: the job's GitHub OIDC token
# is exchanged for a short-lived Anthropic access token (printed redacted), with no API key stored. Run it by hand
# (Actions → anthropic-wif-test → Run workflow) after changing the federation rule, or change this file; release-note.yml signs in the same
# way, through anthropics/claude-code-action.
name: anthropic-wif-test

on:
  workflow_dispatch:
  # And whenever this file changes, on any branch: a manual run needs the workflow on master first.
  push:
    paths:
      - .github/workflows/anthropic-wif-test.yml

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            // The subject the federation rule's pattern has to match, as GitHub wrote it (with the owner's and
            // repository's IDs: repo:<owner>@<id>/<repo>@<id>:ref:<ref>).
            const { sub } = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`Subject: ${sub}`);
      # Prints Anthropic's answer, tokens redacted, and fails unless it holds an access token: a refusal is an
      # `authentication_error` (the federation rule's Authentication log says why; the token's subject is printed
      # by the step above).
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- > "$RUNNER_TEMP/exchange.json" <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_015cLigViCEJyWAtahH5ytSC",
            "organization_id": "34318a61-fac0-4077-a795-808d80efef19",
            "service_account_id": "svac_015F3BEwDj2EJr7bHDgKmFkL",
            "workspace_id": "wrkspc_01G5WKL4tLYspnSa4BYdzUCS"
          }
          JSON
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' "$RUNNER_TEMP/exchange.json"
          jq -e '.access_token | strings' "$RUNNER_TEMP/exchange.json" >/dev/null || { echo "::error::No access token came back (Anthropic's answer is above: an authentication_error is the rule refusing it, an overloaded_error is worth a re-run)."; exit 1; }
