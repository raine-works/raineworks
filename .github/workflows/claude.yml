# Mention @claude in an issue, a comment or a pull request review and Claude answers there, or makes the change on a
# branch. The workflow is Raineworks', in raine-works/agents (.github/workflows/claude.yml): this file only calls it, and comes
# from the raineworks-base skill's templates/workflows/claude.yml. Change the workflow there, for every repository at once;
# here, only its inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    name: Claude
    uses: raine-works/agents/.github/workflows/claude.yml@9bac93eafd58b8d22e41d179650b6d1573cee55b # raine-works/agents master
    # The commands Claude may run, if they aren't a Bun project's (bun install, format, lint, typecheck, test):
    with:
      allowed-commands: >-
        Bash(bun install),Bash(bun run format),Bash(bun run lint),Bash(bun run lint:fix),Bash(bun run typecheck),Bash(bun run test),Bash(bun run build:web)
