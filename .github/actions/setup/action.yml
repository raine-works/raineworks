# Bun (the version package.json pins) and the workspace's packages, from Bun's install cache when the lockfile hasn't
# changed. Every workflow that runs Bun starts with it.
name: Set up Bun
description: Installs Bun and the workspace's packages, cached on the lockfile.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        # A changed lockfile starts from the last cache: only what's new is downloaded.
        restore-keys: bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
